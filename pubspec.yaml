name: pluginfloor
description: >-
  Statically collects the Android minSdk/compileSdk and iOS/macOS deployment
  target floors of every Flutter plugin in an app and fails CI before the build does.
version: 0.1.1
repository: https://github.com/LeeGyeongPil/pluginfloor
issue_tracker: https://github.com/LeeGyeongPil/pluginfloor/issues
topics:
  - flutter
  - ci
  - android
  - ios
  - static-analysis

environment:
  sdk: ^3.8.0

executables:
  pluginfloor:

dependencies:
  args: ^2.7.0
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.31.0
